        <!-- Body -->
        <rect x="64" y="148" width="328" height="160" rx="24" fill="#1B1210" />
        <!-- Knobs -->
        <circle cx="112" cy="228" r="30" fill="#E2765A" />
        <circle cx="112" cy="228" r="11" fill="#1B1210" />
        <circle cx="344" cy="228" r="30" fill="#E2765A" />
        <circle cx="344" cy="228" r="11" fill="#1B1210" />
        <!-- Display -->
        <rect x="160" y="182" width="136" height="60" rx="10" fill="#FFF3EE" />
        <rect x="174" y="198" width="52" height="10" rx="5" fill="#1B1210" />
        <rect x="174" y="217" width="84" height="8" rx="4" fill="#1B1210" opacity="0.45" />
        <!-- Preset buttons -->
        <rect x="160" y="262" width="26" height="14" rx="5" fill="#E2765A" />
        <rect x="194" y="262" width="26" height="14" rx="5" fill="#E2765A" />
        <rect x="228" y="262" width="26" height="14" rx="5" fill="#E2765A" />
        <rect x="262" y="262" width="34" height="14" rx="5" fill="#E2765A" />
    </g>
</svg>
